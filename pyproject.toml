[project]
name = "eve-healthcare-backend"
version = "1.0.0"
description = "EVE Healthcare Diagnostic Booking & Simulated Payment Backend Service"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = [
    "B008",  # Do not perform function call `Depends` in argument defaults (standard FastAPI pattern)
    "E501",  # Line length managed by formatter
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
